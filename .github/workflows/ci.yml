name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # ubuntu-latest ships with a working Docker daemon, which the integration
    # tests need for Testcontainers (postgres:17). No service container required.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore BattleshipGame.sln

      - name: Check formatting (CSharpier)
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build BattleshipGame.sln --no-restore -c Release

      - name: Unit tests
        run: >-
          dotnet test tests/BattleshipGame.UnitTests/BattleshipGame.UnitTests.csproj
          --no-build -c Release --verbosity normal

      - name: Integration tests
        # No LLM needed: the tests replace the model with a scripted fake and supply
        # placeholder OpenAi settings for the API's startup check.
        run: >-
          dotnet test tests/BattleshipGame.IntegrationTests/BattleshipGame.IntegrationTests.csproj
          --no-build -c Release --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    # No path filter: a required check that is skipped on backend-only PRs would
    # leave those PRs waiting forever.
    defaults:
      run:
        working-directory: src/BattleshipGame.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/BattleshipGame.Web/.nvmrc
          cache: npm
          cache-dependency-path: src/BattleshipGame.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test
